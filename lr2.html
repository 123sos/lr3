<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save your account now</title>
</head>
<body style="font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; border-left: 2px solid #333;">

    <div style="text-align: center; max-width: 400px; padding: 20px;">
        <h2 style="font-size: 24px; margin-bottom: 5px;">Save you account now</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 30px;">
            Get unlimited typeforms, questions and responses.<br>Free forever.
        </p>

        <form name="signupForm" method="POST" action="">
            <table cellpadding="10" cellspacing="0" style="width: 100%;">
                <tr>
                    <td style="border-bottom: 1px solid #ddd; padding-left: 0;">
                        <span style="color: #888; margin-right: 8px;">👤</span>
                        <input type="text" id="nickname" name="nickname" placeholder="Name or nickname" required style="border: none; outline: none; width: 85%; font-size: 14px;">
                    </td>
                </tr>
                <tr>
                    <td style="border-bottom: 1px solid #ddd; padding-left: 0;">
                        <span style="color: #888; margin-right: 8px;">✉</span>
                        <input type="email" id="email" name="email" placeholder="Email" required style="border: none; outline: none; width: 85%; font-size: 14px;">
                    </td>
                </tr>
                <tr>
                    <td style="border-bottom: 1px solid #ddd; padding-left: 0;">
                        <span style="color: #888; margin-right: 8px;">🔒</span>
                        <input type="password" id="password" name="password" placeholder="Password" required style="border: none; outline: none; width: 85%; font-size: 14px;">
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding-top: 30px;">
                        <button type="submit" style="background-color: #83c5be; color: white; border: none; width: 180px; padding: 10px; border-radius: 20px; font-size: 14px; cursor: pointer;">Sign up &gt;</button>
                    </td>
                </tr>
            </table>
        </form>

        <div style="margin-top: 25px; font-size: 13px; color: #666;">
            Already have an account? <a href="#" style="color: #f4a261; text-decoration: none;">Login</a>
        </div>
    </div>

</body>
</html>
